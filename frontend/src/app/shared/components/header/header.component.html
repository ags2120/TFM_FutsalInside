<header class="header">
  <div class="header-inner container">
    <a routerLink="/" class="logo" (click)="closeMobileMenu()">
      <img src="assets/logos/FutsalInside_logo.png" alt="" class="logo-icon" width="38" height="38" />
      <span class="logo-text"><span class="logo-accent">Futsal</span>Inside</span>
    </a>

    <div class="search-area">
      <app-global-search />
    </div>

    <nav class="nav" [class.mobile-open]="mobileMenuOpen()" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="closeMobileMenu()">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Inicio</span>
      </a>
      <a routerLink="/matches" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Partidos</span>
      </a>
      <a routerLink="/standings" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>Clasificación</span>
      </a>
      <a routerLink="/teams" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Equipos</span>
      </a>
      <a routerLink="/favorites" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span>Favoritos</span>
      </a>
    </nav>

    <div class="header-actions">
      <a routerLink="/login" class="btn-login" (click)="closeMobileMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span>Iniciar Sesión</span>
      </a>

      <button
        class="hamburger"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-nav"
        aria-label="Menú de navegación"
      >
        <span class="hamburger-line" [class.open]="mobileMenuOpen()"></span>
        <span class="hamburger-line" [class.open]="mobileMenuOpen()"></span>
        <span class="hamburger-line" [class.open]="mobileMenuOpen()"></span>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <div class="mobile-overlay" (click)="closeMobileMenu()" aria-hidden="true"></div>
  }
</header>
